[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assistente-primo-livello"
version = "0.1.0"
description = "Assistente di primo livello: RAG sulla documentazione di prodotto, con citazioni obbligatorie ed escalation umana."
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    # pydantic v2 e' il perno: pydantic-settings 2.x esiste solo per v2,
    # e fastapi >= 0.100 e' la prima serie che supporta v2.
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",

    # chromadb < 0.4.16 e' incompatibile con pydantic v2, e le serie < 0.5
    # pinnavano un proprio fastapi (conflitto con il nostro).
    # 1.x ha il core in Rust: wheel pronte, niente MSVC Build Tools su Windows.
    "chromadb>=1.0",

    # tira torch >= 2.3 (unica serie compatibile con numpy 2.x)
    "sentence-transformers>=3.0",

    # 1.0 introduce il client OpenAI(base_url=...); 1.40 l'output strutturato
    # via response_format json_schema.
    "openai>=1.40",

    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",

    # typer < 0.12 si rompe con click >= 8.1.4
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # richiesto da starlette TestClient per i test dell'API
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project root, so that tests can import their shared doubles from
# tests.conftest. The package itself is imported from the installed src layout.
pythonpath = ["."]
addopts = "--cov=assistant --cov-report=term-missing"
